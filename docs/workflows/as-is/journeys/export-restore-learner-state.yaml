schema: lingotorte.workflow-journey.v1
id: export-restore-learner-state
title: Export learner state and restore it (merge) through the local service
goal: >-
  Make a local JSON copy of my saved words, cards and history, and bring such a copy back into the app.
actor: learner
evidence:
  kind: observed-live
  ref: "docs/dev/lt-3kk-daily-driver-journey-plan.md (live run 4, journey-11 PASS; durable receipt, commit 200, readback)"
  note: >-
    The run captured the download in page memory and pasted it back; a real learner downloads a file and
    pastes its text. Button and banner texts are traced to apps/web/src/views/exportImport.ts.
preconditions:
  - Paired with the local service (daily-driver s02) and some learner state exists.
variants:
  - id: save-to-chosen-file
    divergesAt: s02-download
    summary: >-
      With File System Access a second button "Save export to chosen file" writes through a save picker and
      confirms by readback ("Verified: … saved and readback matched …").
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:84" }
  - id: browser-only-restore
    divergesAt: s05-refresh-service-preview
    summary: >-
      When no service is connected, "Restore now" enables straight after the local preview and restores into
      the browser store only.
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:351" }
  - id: replace-mode
    divergesAt: s04-choose-mode
    summary: >-
      "Replace active learner data" removes active records absent from the file (prior history kept as
      inactive audit).
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:276" }
  - id: anki-export
    divergesAt: s01-generate
    summary: The same view offers Anki exports (.apkg via the service, .txt in the browser); not part of restore.
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:139" }
steps:
  - id: s01-generate
    view: export-import
    title: Generate the export
    userSees: >-
      Export / Import view; a long intro paragraph on what the learner-subset export includes/excludes;
      "Export learner state" with the primary "Generate local export".
    userDoes:
      - { kind: click, target: shell.btn, note: nav "Export / Import" }
      - { kind: click, target: export-import.generate-local-export }
    feedback: >-
      Success banner (role=status) "Learner-state export v1 ready: <file> • N records • N privacy warnings •
      manifest integrity verified … • no media files copied"; a Schema / App version / Exported at / root hash
      list; then "Download export JSON" (and "Save export to chosen file" when supported).
    source: ["apps/web/src/views/exportImport.ts:40", "apps/web/src/model.ts:4078"]
    evidence: { kind: observed-live, ref: lt-3kk journey-11 }
  - id: s02-download
    view: export-import
    title: Download the JSON
    userSees: '"Download export JSON" secondary button; a note that browser downloads are not read back.'
    userDoes:
      - { kind: click, target: export-import.download-export-json }
    feedback: Browser download of the manifest JSON (object URL + anchor click); no in-app confirmation beyond the existing banner.
    source: ["apps/web/src/views/exportImport.ts:75"]
    evidence: { kind: observed-live, ref: "lt-3kk journey-11 (blob captured in page memory)" }
  - id: s03-paste-and-preview
    view: export-import
    title: Paste the manifest and preview
    userSees: '"Import / restore learner state" group: label "Paste export manifest JSON", a textarea, "Preview restore".'
    userDoes:
      - { kind: paste, target: export-import.import-manifest }
      - { kind: click, target: export-import.preview-restore }
    feedback: >-
      "Restore preview" region: Schema / App version / Exported at / record count / root hash; a
      "Metadata-only restore preview" note; per-collection counts; an operation preview; a safety banner
      ("Safe to restore: local learner state is empty." or "Local learner state exists. Resolve the conflict
      below before restoring."); an integrity banner.
    canFail:
      - condition: Textarea content is not a valid manifest
        appResponse: Error message in the view; preview cleared
        recovery: Fix the pasted text and preview again
        source: "apps/web/src/views/exportImport.ts:174"
      - condition: Manifest root hash does not match
        appResponse: 'Integrity banner in error tone: "Manifest integrity warning: recomputed hash does not match…"'
        source: "apps/web/src/views/exportImport.ts:238"
      - condition: Textarea edited after preview
        appResponse: '"Restore input changed; preview and confirm again." and the preview is discarded'
        recovery: Preview again
        source: "apps/web/src/views/exportImport.ts:159"
    source: ["apps/web/src/views/exportImport.ts:151", "apps/web/src/views/exportImport.ts:165", "apps/web/src/model.ts:4118"]
    evidence: { kind: observed-live, ref: "lt-3kk journey-11 (preview integrity verified)" }
  - id: s04-choose-mode
    view: export-import
    title: Choose merge and acknowledge warnings
    userSees: >-
      "Resolve restore conflict" with two checkboxes (Merge/update … / Replace active learner data …) and an
      error line "Restore requires one of the options above to be selected."; a "Privacy warnings" list with
      one checkbox per warning kind.
    userDoes:
      - { kind: click, target: export-import.restore-confirm-overwrite, note: Merge/update }
      - { kind: click, target: export-import.checkbox, note: one per privacy warning }
    decision: >-
      Merge/update vs Replace active learner data (mutually exclusive checkboxes); when local state is empty a
      single "I confirm this restore." checkbox replaces them.
    feedback: >-
      Checking one mode unchecks the other; the error line hides; "Restore now" stays disabled until all
      warnings are acknowledged and, when connected, until the authoritative preview is refreshed.
    source: ["apps/web/src/views/exportImport.ts:250", "apps/web/src/views/exportImport.ts:319", "apps/web/src/views/exportImport.ts:342"]
    evidence: { kind: observed-live, ref: "lt-3kk journey-11 (conflict choice shown; Merge ticked)" }
  - id: s05-refresh-service-preview
    view: export-import
    title: Refresh the authoritative service preview
    userSees: '"Refresh authoritative service preview" button next to "Restore now" (connected only).'
    userDoes:
      - { kind: click, target: export-import.refresh-authoritative-service-preview }
    feedback: The service-side preview replaces the local one; "Restore now" becomes enabled.
    api: ["POST /api/restore/preview"]
    canFail:
      - condition: Service preview fails
        appResponse: Error message in the view; Restore stays disabled
        source: "apps/web/src/views/exportImport.ts:368"
    source: ["apps/web/src/views/exportImport.ts:364", "apps/web/src/model.ts:4205"]
    evidence: { kind: observed-live, ref: lt-3kk journey-11 }
  - id: s06-restore
    view: export-import
    title: Restore now
    userSees: '"Restore now" primary button enabled.'
    userDoes:
      - { kind: click, target: export-import.restore-now }
    feedback: >-
      Button disables while committing; on success the view re-renders with the restore result and no
      role=alert banner; Saved/Review show the merged set.
    persists: ["restored learner subset merged into the service store (saved items, occurrences, cards, states, events, attempts)", new state revision]
    api: ["POST /api/restore/commit", "GET /api/state"]
    canFail:
      - condition: Commit rejected or outcome unknown
        appResponse: 'Error message in the view; reconnect is blocked with "Restore pending; wait for acknowledgement/readback before reconnecting."'
        source: "apps/web/src/model.ts:449"
    source: ["apps/web/src/views/exportImport.ts:347", "apps/web/src/model.ts:4244"]
    evidence: { kind: observed-live, ref: "lt-3kk journey-11 (exactly 1 commit, 200, readback equal to pre-merge projection)" }
outcome:
  summary: >-
    A local JSON export exists outside the app, and restoring it as a merge leaves the service state identical
    to before (same records), with a durable receipt.
  persisted: ["learner subset merge (no-op when identical)", service revision]
observations:
  - id: o1-paste-only-import
    atStep: s03-paste-and-preview
    text: >-
      Import is paste-into-textarea only; there is no file picker for the exported JSON, while export has both
      a download and a save-picker path.
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:151" }
  - id: o2-three-confirmations
    atStep: s04-choose-mode
    text: >-
      A connected merge needs the mode checkbox, every warning checkbox and an explicit service preview
      refresh before Restore enables (three distinct confirmation gestures plus the preview click).
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:351" }
  - id: o3-dense-copy
    atStep: s01-generate
    text: >-
      The view opens with a long intro paragraph, and the preview adds further explanatory paragraphs before
      any control.
    evidence: { kind: source-reading, ref: "apps/web/src/views/exportImport.ts:31" }
